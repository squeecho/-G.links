<style>
/* =========================================================
   IGGG Design System v1.1 — tokens
   ========================================================= */
:root {
  --fz-display-xl: clamp(3rem, 7vw, 5rem);
  --fz-display-l:  clamp(2rem, 5vw, 3rem);
  --fz-display-m:  1.5rem;
  --fz-body:       0.9375rem;
  --fz-mono-l:     0.8125rem;
  --fz-mono-m:     0.6875rem;
  --fz-mono-s:     0.625rem;
  --ls-display:    -0.02em;
  --ls-mono:       0.08em;
  --ls-mono-wide:  0.18em;
  --line-1: 1px;
  --radius-cap: 999px;
  --radius-md: 4px;
  --sp-1: 4px; --sp-2: 8px; --sp-3: 12px; --sp-4: 16px;
  --sp-6: 24px; --sp-8: 32px;
  --ease-out: cubic-bezier(0.22, 1, 0.36, 1);
  --dur-fast: 120ms;
  --dur-base: 200ms;
  --ff-display: "Inter", "Pretendard Variable", system-ui, sans-serif;
  --ff-mono:    "JetBrains Mono", ui-monospace, monospace;
  --ff-body:    "Pretendard Variable", "Inter", system-ui, sans-serif;
}

/* Dark (default) */
:root[data-theme="dark"] {
  --bg:        #0a0a0a;
  --bg-elev:   #141414;
  --bg-input:  #2d2d2d;
  --bg-input-focus: #383838;
  --fg:        #f4f2ed;
  --fg-mute:   rgba(244, 242, 237, 0.6);
  --fg-faint:  rgba(244, 242, 237, 0.4);
  --line:      rgba(244, 242, 237, 0.55);
  --line-soft: rgba(244, 242, 237, 0.35);
  --accent:    #f4f2ed;
  --accent-fg: #0a0a0a;
  --danger:    #ff6b5e;
  --grain-opacity: 0.08;
  --logo-filter: invert(1);
}

/* Light */
:root[data-theme="light"] {
  --bg:        #f4f2ed;
  --bg-elev:   #ebe8e1;
  --bg-input:  #ffffff;
  --bg-input-focus: #ffffff;
  --fg:        #0a0a0a;
  --fg-mute:   rgba(10, 10, 10, 0.62);
  --fg-faint:  rgba(10, 10, 10, 0.32);
  --line:      rgba(10, 10, 10, 0.55);
  --line-soft: rgba(10, 10, 10, 0.16);
  --accent:    #0a0a0a;
  --accent-fg: #f4f2ed;
  --danger:    #c8302a;
  --grain-opacity: 0.04;
  --logo-filter: none;
}

/* System fallback */
@media (prefers-color-scheme: light) {
  :root:not([data-theme]) {
    --bg: #f4f2ed; --bg-elev: #ebe8e1;
    --bg-input: #ffffff; --bg-input-focus: #ffffff;
    --fg: #0a0a0a;
    --fg-mute: rgba(10,10,10,0.62);
    --fg-faint: rgba(10,10,10,0.32);
    --line: rgba(10,10,10,0.55); --line-soft: rgba(10,10,10,0.16);
    --accent: #0a0a0a; --accent-fg: #f4f2ed;
    --grain-opacity: 0.04;
    --logo-filter: none;
  }
}

/* ---- Reset ---- */
* { box-sizing: border-box; margin: 0; padding: 0; }

body {
  font-family: var(--ff-body);
  background: var(--bg);
  color: var(--fg);
  font-size: var(--fz-body);
  min-height: 100dvh;
  -webkit-font-smoothing: antialiased;
  transition: background var(--dur-base), color var(--dur-base);
}

/* Grain overlay */
body::before {
  content: "";
  position: fixed; inset: 0; pointer-events: none; z-index: 1;
  opacity: var(--grain-opacity);
  background-image: url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='200' height='200'><filter id='n'><feTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='2' stitchTiles='stitch'/></filter><rect width='100%25' height='100%25' filter='url(%23n)'/></svg>");
  mix-blend-mode: overlay;
}
body > * { position: relative; z-index: 2; }

/* ---- Theme toggle ---- */
.theme-toggle {
  position: fixed;
  top: var(--sp-3);
  right: var(--sp-3);
  z-index: 100;
  background: var(--bg);
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-3);
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-m);
  letter-spacing: var(--ls-mono);
  color: var(--fg);
  cursor: pointer;
  text-transform: uppercase;
  transition: background var(--dur-fast);
}
.theme-toggle:hover { background: var(--bg-elev); }

/* =========================================================
   LOGIN SCREEN
   ========================================================= */
.login-screen {
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  min-height: 100dvh;
  padding: var(--sp-8);
  animation: fadeIn 0.6s var(--ease-out);
}

.login-logo {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: var(--sp-2);
  margin-bottom: var(--sp-8);
}

.logo-img {
  height: 80px;
  width: auto;
  display: block;
  filter: var(--logo-filter);
}

.logo-sub {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-l);
  font-weight: 400;
  letter-spacing: var(--ls-mono-wide);
  color: var(--fg-faint);
  text-transform: lowercase;
}

.login-box {
  width: 100%;
  max-width: 320px;
}

/* Labels — 한글 친화 (v1.1: body font, no uppercase) */
.input-group {
  position: relative;
  margin-bottom: var(--sp-4);
}

.input-group .label {
  display: block;
  font-family: var(--ff-body);
  font-weight: 600;
  font-size: var(--fz-body);
  color: var(--fg);
  margin-bottom: var(--sp-2);
}
.label__sub {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
  margin-left: var(--sp-2);
  font-weight: 400;
}

/* Inputs — v1.1: bg-input #2d2d2d, focus: bg-input-focus */
.input {
  width: 100%;
  background: var(--bg-input);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  padding: var(--sp-2) var(--sp-3);
  font-size: var(--fz-body);
  font-family: var(--ff-body);
  color: var(--fg);
  outline: none;
  transition: border-color var(--dur-fast) var(--ease-out),
              background var(--dur-fast) var(--ease-out);
}
.input:focus {
  border-color: var(--fg);
  background: var(--bg-input-focus);
}

/* ID input — mono font for credentials */
.input-id {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-l);
  letter-spacing: var(--ls-mono);
  padding: var(--sp-3);
}

/* Auto-login checkbox */
.auto-login {
  display: flex;
  align-items: center;
  gap: var(--sp-2);
  margin: var(--sp-4) 0 var(--sp-6);
  cursor: pointer;
}
.auto-login input[type="checkbox"] { display: none; }

.checkbox-custom {
  width: 16px;
  height: 16px;
  border: var(--line-1) solid var(--line);
  border-radius: 2px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all var(--dur-fast);
  flex-shrink: 0;
}
.auto-login input:checked + .checkbox-custom {
  background: var(--accent);
  border-color: var(--accent);
}
.auto-login input:checked + .checkbox-custom::after {
  content: '';
  width: 4px;
  height: 8px;
  border: solid var(--accent-fg);
  border-width: 0 1.5px 1.5px 0;
  transform: rotate(45deg) translateY(-1px);
}
.auto-login span {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  color: var(--fg-mute);
}

/* Login button — btn-primary (v1.1: 페이지당 1~2개) */
.btn-login {
  width: 100%;
  background: var(--accent);
  color: var(--accent-fg);
  border: var(--line-1) solid var(--accent);
  border-radius: var(--radius-md);
  padding: 14px;
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-l);
  font-weight: 500;
  letter-spacing: var(--ls-mono);
  cursor: pointer;
  text-transform: uppercase;
  transition: opacity var(--dur-fast);
}
.btn-login:hover { opacity: 0.85; }
.btn-login:active { transform: scale(0.98); }

.login-error {
  font-family: var(--ff-body);
  font-size: var(--fz-mono-m);
  color: var(--danger);
  text-align: center;
  margin-top: var(--sp-4);
  min-height: 1.2em;
  opacity: 0;
  transition: opacity 0.3s;
}
.login-error.visible { opacity: 1; }

/* =========================================================
   LINKS SCREEN
   ========================================================= */
.links-screen {
  display: none;
  min-height: 100dvh;
  max-width: 520px;
  margin: 0 auto;
  padding: var(--sp-4);
  animation: fadeIn 0.5s var(--ease-out);
}

/* Hero */
.links-hero {
  padding: var(--sp-8) 0 var(--sp-4);
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  border-bottom: var(--line-1) dashed var(--line-soft);
  margin-bottom: var(--sp-6);
}

.links-hero-brand {
  display: flex;
  flex-direction: column;
  gap: var(--sp-1);
}

.links-hero-studio {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  font-weight: 400;
  letter-spacing: 0.06em;
  color: var(--fg-faint);
  transform: scaleX(0.9);
  transform-origin: left;
}

.links-hero-title {
  font-family: var(--ff-display);
  font-weight: 900;
  font-size: var(--fz-display-m);
  letter-spacing: var(--ls-display);
  line-height: 1;
}

.account-box {
  display: flex;
  flex-direction: column;
  align-items: flex-end;
  gap: 6px;
}
.account-email {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-mute);
}
.logout-btn {
  background: none;
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-cap);
  color: var(--fg-mute);
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  cursor: pointer;
  padding: var(--sp-1) var(--sp-3);
  text-transform: uppercase;
  transition: color var(--dur-fast), border-color var(--dur-fast);
}
.logout-btn:hover {
  color: var(--danger);
  border-color: var(--danger);
}

/* Logout confirm bar */
.logout-confirm {
  background: var(--bg-elev);
  border: var(--line-1) solid var(--line);
  border-radius: var(--radius-md);
  padding: var(--sp-3) var(--sp-4);
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: var(--sp-3);
  margin-bottom: var(--sp-4);
  animation: fadeIn 0.2s var(--ease-out);
}
.logout-confirm span {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  font-weight: 500;
}
.logout-confirm-btns {
  display: flex;
  gap: var(--sp-2);
}
.btn-confirm-yes {
  background: var(--danger);
  color: #fff;
  border: none;
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-4);
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  font-weight: 500;
  cursor: pointer;
}
.btn-confirm-no {
  background: transparent;
  color: var(--fg-mute);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-cap);
  padding: var(--sp-1) var(--sp-4);
  font-family: var(--ff-body);
  font-size: var(--fz-mono-l);
  cursor: pointer;
}
.btn-confirm-no:hover { color: var(--fg); border-color: var(--line); }

/* Category group */
.category {
  margin-bottom: var(--sp-6);
}
.category + .category {
  border-top: var(--line-1) solid var(--line-soft);
  padding-top: var(--sp-6);
}

/* Link card */
.link-card {
  display: flex;
  align-items: center;
  gap: var(--sp-4);
  padding: var(--sp-3) var(--sp-4);
  background: var(--bg-elev);
  border: var(--line-1) solid var(--line-soft);
  border-radius: var(--radius-md);
  margin-bottom: var(--sp-2);
  text-decoration: none;
  color: var(--fg);
  transition: border-color var(--dur-base) var(--ease-out),
              transform var(--dur-fast);
  cursor: pointer;
}
.link-card:hover {
  border-color: var(--line);
  transform: translateX(3px);
}
.link-card:active {
  transform: translateX(3px) scale(0.99);
}

.link-icon {
  width: 44px;
  height: 44px;
  border-radius: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  flex-shrink: 0;
  background: transparent;
  border: var(--line-1) solid var(--line-soft);
}
.link-icon svg {
  width: 22px;
  height: 22px;
  stroke: var(--icon-c, var(--fg));
  stroke-width: 0.7;
  fill: none;
}

.link-info {
  flex: 1;
  min-width: 0;
}

.link-name.martian {
  font-family: "Martian Mono", monospace;
  font-weight: 600;
  font-size: 0.85rem;
  letter-spacing: -0.02em;
}

.link-name {
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  font-weight: 500;
  margin-bottom: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link-desc {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  color: var(--fg-faint);
  letter-spacing: var(--ls-mono);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.link-arrow {
  flex-shrink: 0;
  transition: opacity var(--dur-fast);
  opacity: 0.3;
}
.link-arrow svg {
  width: 14px;
  height: 14px;
  stroke: var(--fg);
  stroke-width: 0.7;
  fill: none;
}
.link-card:hover .link-arrow {
  opacity: 0.8;
}

/* Footer */
.links-footer {
  border-top: var(--line-1) dashed var(--line-soft);
  margin-top: var(--sp-8);
  padding-top: var(--sp-4);
  display: flex;
  justify-content: space-between;
  align-items: center;
  gap: var(--sp-3);
  flex-wrap: wrap;
  padding-bottom: var(--sp-8);
}
.links-footer span {
  font-family: var(--ff-mono);
  font-size: var(--fz-mono-s);
  letter-spacing: var(--ls-mono);
  color: var(--fg-faint);
  text-transform: uppercase;
}

/* Toast */
#toast {
  display: none;
  position: fixed;
  bottom: 30px;
  left: 50%;
  transform: translateX(-50%);
  background: var(--accent);
  color: var(--accent-fg);
  padding: var(--sp-3) var(--sp-4);
  border-radius: var(--radius-cap);
  font-family: var(--ff-body);
  font-size: var(--fz-body);
  font-weight: 500;
  z-index: 1000;
}

/* Animations */
@keyframes fadeIn {
  from { opacity: 0; transform: translateY(8px); }
  to { opacity: 1; transform: translateY(0); }
}

.link-card {
  animation: cardIn 0.35s var(--ease-out) backwards;
}
@keyframes cardIn {
  from { opacity: 0; transform: translateX(-6px); }
  to { opacity: 1; transform: translateX(0); }
}

@keyframes shake {
  0%, 100% { transform: translateX(0); }
  20% { transform: translateX(-6px); }
  40% { transform: translateX(5px); }
  60% { transform: translateX(-4px); }
  80% { transform: translateX(3px); }
}
.shake { animation: shake 0.4s ease; }

/* Responsive */
@media (max-width: 480px) {
  .links-screen { padding: var(--sp-3); }
  .link-card { padding: var(--sp-3); gap: var(--sp-3); }
}
</style>
</head>

<script>
// ── Theme ──
function toggleTheme() {
  const root = document.documentElement;
  const cur = root.dataset.theme || 'dark';
  const next = cur === 'dark' ? 'light' : 'dark';
  root.dataset.theme = next;
  localStorage.setItem('iggg-theme', next);
  document.getElementById('themeToggle').textContent = next === 'dark' ? 'dark / 01' : 'light / 02';
}
(function initTheme(){
  const saved = localStorage.getItem('iggg-theme');
  const sys = matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark';
  const t = saved || sys;
  document.documentElement.dataset.theme = t;
  document.addEventListener('DOMContentLoaded', () => {
    const btn = document.getElementById('themeToggle');
    if (btn) btn.textContent = t === 'dark' ? 'dark / 01' : 'light / 02';
  });
})();

// ── Toast ──
function showToast(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.style.display = 'block';
  setTimeout(() => t.style.display = 'none', 2000);
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  AUTH LOGIC — 자체 계정 로그인 제거(입장 통제=sso-gate.js).
//  구 계정 해시·검증 함수는 공개 배포물에서 삭제(전수감사 2026-07-28),
//  구 자동로그인 토큰은 아래 초기화에서 기기에서 청소한다.
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

function requestLogout() {
  document.getElementById('logoutConfirm').style.display = 'flex';
}
function cancelLogout() {
  document.getElementById('logoutConfirm').style.display = 'none';
}
function handleLogout() {
  // SSO 로그아웃 — 쿠키를 지우고 www 의 전역 로그아웃 진입점(?logout=1)으로 이동.
  // (www 루트로만 가면 세션 정본(localStorage)이 쿠키를 재발급해 로그아웃이 무효였다 — 전수감사 2026-07-28)
  document.cookie = 'iggg_sso=; Path=/; Domain=.igggstudio.com; Max-Age=0';
  location.href = 'https://www.igggstudio.com/?logout=1';
}

// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━
//  RENDER
// ━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━━

// SMBM 카드 노출 대상 — money 백엔드 허용자와 동일 인원의 이메일 SHA-256(trim+소문자).
// [0]=SMBM 본편(사장 전용), [1]=SMBM lite 테넌트(데이터 격리) 사용자 — 입구 주소가 같아 함께 노출.
// 평문 이메일을 공개 소스에 남기지 않기 위한 해시 대조(진짜 차단은 money 앱). 인원 변경 시 이 목록도 갱신.
const SMBM_VIEWER_SHA256 = [
  '9da61a6d6ff343481bd0fad17331692c126a93e464f7911f38d5b77e0237e2ab',
  '172892638eb946bb812a0871dc4b133c925af7e410fbf5e48acefddf042d3f36',
];
async function smbmCardVisible() {
  try {
    const m = document.cookie.match(/(?:^|; )iggg_sso=([^;]*)/);
    if (!m) return false;
    const email = ((JSON.parse(decodeURIComponent(m[1])) || {}).email || '').trim().toLowerCase();
    if (!email || !window.crypto || !crypto.subtle) return false;
    const buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(email));
    const hex = Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
    return SMBM_VIEWER_SHA256.includes(hex);
  } catch (e) { return false; /* 판정 실패 = 숨김(안전 기본값) */ }
}

async function showLinks() {
  const showSmbm = await smbmCardVisible();
  document.getElementById('loginScreen').style.display = 'none';
  const screen = document.getElementById('linksScreen');
  screen.style.display = 'block';

  const container = document.getElementById('linksContainer');
  container.innerHTML = '';

  let cardIndex = 0;

  LINKS.forEach(group => {
    const cat = document.createElement('div');
    cat.className = 'category';

    // 카테고리 라벨 비표시 — 사장 지시 2026-07-28. 그룹 구분선은 유지,
    // LINKS 의 category 값은 코드 구획용으로만 남긴다(렌더 안 함).

    group.items.forEach(item => {
      if (item.gate === 'smbm' && !showSmbm) return; // 허용자 외 SMBM 카드 숨김
      const a = document.createElement('a');
      a.className = 'link-card';
      a.href = item.url;
      // 같은 탭 이동(2026-07-28) — 허브는 랜딩이라 '하나의 앱' 감각이 맞고,
      // PWA(standalone)에서 target=_blank 로 탭이 계속 쌓이던 문제도 해소된다.
      a.rel = 'noopener noreferrer';
      a.style.animationDelay = `${cardIndex * 0.05}s`;
      if (item.bg) {
        a.querySelector || true;
      }
      a.innerHTML = `
        <div class="link-icon" style="${item.bg ? 'background:'+item.bg+';border-color:'+item.bg+';' : ''}${item.iconColor ? '--icon-c:'+item.iconColor+';' : ''}">${item.iconColor ? item.icon.replace(/currentColor/g, item.iconColor).replace(/stroke="var\(--fg\)"/g, 'stroke="'+item.iconColor+'"') : item.icon}</div>
        <div class="link-info">
          <div class="link-name${item.font ? ' '+item.font : ''}">${item.name}</div>
          <div class="link-desc">${item.desc}</div>
        </div>
        <div class="link-arrow"><svg viewBox="0 0 20 20"><line x1="5" y1="10" x2="15" y2="10"/><polyline points="11 6 15 10 11 14"/></svg></div>
      `;
      cat.appendChild(a);
      cardIndex++;
    });

    container.appendChild(cat);
  });
}

// 자체 계정 로그인 제거(2026-07-27) — 입장 통제는 sso-gate.js(ig works SSO)
try { localStorage.removeItem('ig_links_token'); } catch (e) { /* 구 토큰 청소 실패 무해 */ }
showLinks();
// 푸터 연도 — 하드코딩(©2026) 대신 동적으로
try {
  const fy = document.getElementById('footerYear');
  if (fy) fy.textContent = '©' + new Date().getFullYear();
} catch (e) { /* 표시 실패는 치명 아님 */ }
// 로그인 계정 표시(사장 요청 2026-07-27) — iggg_sso 쿠키의 email
try {
  const m = document.cookie.match(/(?:^|; )iggg_sso=([^;]*)/);
  if (m) {
    const email = (JSON.parse(decodeURIComponent(m[1])) || {}).email || '';
    if (email) document.getElementById('accountEmail').textContent = email;
  }
} catch (e) { /* 표시 실패는 치명 아님 */ }
</script>
